<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<body>
<x-dc>
<svg viewBox="0 0 24 24" width="100%" height="100%" preserveAspectRatio="{{ par }}" style="display:block;overflow:visible;filter:{{ flt }}">
<defs><clipPath id="{{ cid }}"><sc-for list="{{ sil }}" as="p"><path d="{{ p }}"></path></sc-for></clipPath></defs>
<g style="clip-path:url(#{{ cid }})" opacity="{{ op }}"><sc-for list="{{ tris }}" as="q"><polygon points="{{ q.p }}" fill="{{ q.f }}" stroke="{{ q.f }}" stroke-width=".2"></polygon></sc-for></g>
<sc-for list="{{ lines }}" as="p"><path d="{{ p }}" fill="none" stroke="{{ dark }}" stroke-width="{{ lw }}" stroke-linecap="round" stroke-linejoin="round"></path></sc-for>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:96,&quot;height&quot;:96},&quot;k&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Acorn&quot;,&quot;Cone&quot;,&quot;Sprig&quot;,&quot;Clover&quot;,&quot;Clock&quot;,&quot;Reed&quot;,&quot;Water&quot;,&quot;Crystal&quot;,&quot;Frost&quot;,&quot;Globe&quot;],&quot;default&quot;:&quot;Acorn&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;uid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;preview&quot;,&quot;tsType&quot;:&quot;string&quot;}}">

const G = {
  Acorn: ['#c98a3e', ['M5 10 Q12 3 19 10 Z', 'M6.5 10 Q6.5 20 12 22 Q17.5 20 17.5 10 Z'], ['M12 5.5 V2.5'], 0, 1.8],
  Cone: ['#8a5a3a', ['M12 2 Q18 8 16.5 15 Q15 20.5 12 22 Q9 20.5 7.5 15 Q6 8 12 2Z'], ['M8 9 L16 15 M16 9 L8 15 M7.5 13 L12 17 L16.5 13'], 1, 1.8],
  Sprig: ['#7fa35a', ['M10.2 22 Q10.2 12 14.2 2.6 L15.9 3.4 Q12.1 12.5 12.1 22Z', 'M11 16.8 Q3.2 16.8 2.2 9.4 Q10.2 9.8 11 16.8Z', 'M13.2 11.2 Q20.8 10.7 21.8 3.4 Q14 3.8 13.2 11.2Z', 'M11.4 21 Q18.4 21 20.6 14.6 Q13.4 14 11.4 21Z'], [], 2, 1.8],
  Clover: ['#b8607a', [C(12, 8, 4.4), C(7.8, 9.6, 3), C(16.2, 9.6, 3), C(9.2, 5, 2.6), C(14.8, 5, 2.6), C(12, 3.4, 2.4), 'M10.9 12 H13.1 V22.2 H10.9Z', 'M12.6 19.2 Q14 14.4 19.8 13.9 Q18.7 19 12.6 19.9Z'], [], 3, 1.8],
  Clock: ['#d6c290', DF, DL, 4, 0.8],
  Reed: ['#8a5a34', ['M8.8 4.2 Q8.8 2.6 12 2.6 Q15.2 2.6 15.2 4.2 V13.4 Q15.2 15.2 12 15.2 Q8.8 15.2 8.8 13.4Z', 'M11.35 3 V0.8 H12.65 V3Z', 'M10.9 14.6 H13.1 V22.6 H10.9Z', 'M12.6 22.6 Q16.6 17 18 7.2 Q20.2 10 19.4 13.6 Q18 19.6 14.8 22.6Z'], [], 5, 1.8],

  Frost: ['#7fbfd0', snow, [], 9, 1.8],

  Sky: ['#8b95a2', ['M-1 -1 H25 V25 H-1Z'], [], 40, 1],
  Band: ['#c4bfb2', ['M-1 10.4 L25 8.4 L25 15.4 L-1 16.6Z'], [], 41, 1],
  Top: ['#4f8a5a', ['M1.5 15 L11.5 9.6 L22.5 13 L12.5 19.4Z'], [], 42, 1],

const hx = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));

function facets(seed, base) {
  const N = 4; let s = seed * 131 + 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const st = 26 / N, V = [];

  const at = (x, y) => V[y * (N + 1) + x], out = [];

    const a = at(x, y), b = at(x + 1, y), c = at(x, y + 1), d = at(x + 1, y + 1);
    for (const q of ((x + y) % 2 ? [[a, b, d], [a, d, c]] : [[a, b, c], [b, d, c]])) {

      out.push({ p: q.map((v) => v[0].toFixed(2) + ',' + v[1].toFixed(2)).join(' '), f: t < 0.5 ? mix(base, '#fffaf0', (0.5 - t) * 1.3) : mix(base, '#1a140e', (t - 0.5) * 1.1) });
    }
  }
  return out;
}
const cache = {};
class Component extends DCLogic {
  renderVals() {
    const k = G[this.props.k] ? this.props.k : 'Acorn', e = G[k], tint = this.props.tint || e[0], seed = e[3] + (this.props.seed || 0);
    const ck = k + tint + seed, stretch = !!this.props.stretch;
    if (this.props.flat) return { cid: 'zg-' + (this.props.uid || k), sil: e[1], tris: [{ p: '-1,-1 25,-1 25,25 -1,25', f: tint }], lines: [], lw: 0, dark: tint, op: 1, par: 'xMidYMid meet', flt: 'none' };

    return { cid: 'zg-' + (this.props.uid || k), sil: e[1], tris: cache[ck], lines: e[2], lw: e[4], dark: mix(tint, '#1a140e', 0.45), op: 1, par: stretch ? 'none' : 'xMidYMid meet', flt: stretch ? 'none' : 'drop-shadow(0 1.5px 0 rgba(12,9,5,.3))' };
  }
}
</script>
