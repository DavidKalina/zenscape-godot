name: Godot desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/godot-build*"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: godot-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_CPP_REVISION: 6cceaf6a5f8b0d78ac5d71c139fd7fabba43b918

jobs:
  downloads:
    name: Prepare private draft downloads
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # main publishes one rolling release instead (see the upload step);
      # branches and tags still get a draft per run.
      - name: Create draft release
        id: release
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "Godot desktop · ${GITHUB_REF_NAME} · ${GITHUB_SHA:0:7}" \
            --notes-file docs/desktop-builds.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  export:
    name: Build and verify (${{ matrix.platform }})
    needs: downloads
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write # Verified downloads use drafts, avoiding artifact-storage quotas.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official editor and export templates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/install_desktop_ci.py
      - name: Check out pinned Godot C++ bindings
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ env.GODOT_CPP_REVISION }}
          path: builds/godot-cpp
      - name: Compile debug and release native kernels
        run: |
          python -c "from pathlib import Path; Path('builds/.gdignore').touch()"
          python -m pip install scons==4.8.1
          for target in template_debug template_release; do
            python tools/build_native_kernels.py --godot "$GODOT" \
              --godot-cpp builds/godot-cpp --target "$target" --arch "${{ matrix.arch }}"
          done
          if [[ "$RUNNER_OS" == macOS ]]; then
            lipo native/terrain_kernels/bin/libzenscape_kernels.macos.template_release.universal.dylib -verify_arch arm64 x86_64
          fi
      - name: Import project assets
        run: |
          "$GODOT" --headless --path . --import 2>&1 | tee import.log
          python tools/ci_log_check.py import.log
      - name: Verify native kernel matches GDScript
        run: |
          "$GODOT" --headless --path . --script res://tests/test_threaded_mesh.gd -- --native-kernels 2>&1 | tee native-test.log
          python tools/ci_log_check.py native-test.log
      - name: Export release build
        run: |
          mkdir -p builds/windows
          if [[ "$RUNNER_OS" == Windows ]]; then out=builds/windows/ZenScape.exe; else out=builds/ZenScape-mac-universal.zip; fi
          "$GODOT" --headless --path . --export-release "${{ matrix.platform }}" "$out" 2>&1 | tee export.log
          python tools/ci_log_check.py export.log
      # Copies the export out of the checkout and runs it there: headless,
      # 400 frames from the title on a fresh user folder; fails on a non-zero
      # exit or any SCRIPT ERROR / ERROR line bar the exit leak reports
      # (a kernel DLL that does not load logs ERROR lines).
      - name: Run the exported game outside the checkout
        run: python tools/verify_desktop_export.py
      - name: Package Windows download
        if: runner.os == 'Windows'
        run: |
          cp docs/desktop-builds.md builds/windows/README.md
          printf 'Commit: %s\nGodot: %s\nNative terrain kernel: required and verified\n' "$GITHUB_SHA" "$GODOT_VERSION" > builds/windows/BUILD.txt
          python -c "import shutil; shutil.make_archive('builds/ZenScape-windows-x64', 'zip', 'builds/windows')"
      - name: Upload verified download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.downloads.outputs.tag }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            archive=ZenScape-windows-x64
          else
            archive=ZenScape-mac-universal
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # One published release, always the latest green build of main,
            # under a fixed file name so the README's link never changes:
            # releases/latest/download/ZenScape-windows-x64.zip
            tag=windows-latest
            title="ZenScape for Windows · ${GITHUB_SHA:0:7}"
            { printf 'Latest build of `main`: commit `%s`, %s.\n\n' "${GITHUB_SHA:0:7}" "$(date -u +%Y-%m-%d)"; cat docs/desktop-builds.md; } > release-notes.md
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" "builds/$archive.zip" --clobber
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null
              gh release edit "$tag" --title "$title" --notes-file release-notes.md --latest
            else
              gh release create "$tag" --target "$GITHUB_SHA" --latest --title "$title" \
                --notes-file release-notes.md "builds/$archive.zip"
            fi
          else
            tag="$BUILD_TAG"
            mv "builds/$archive.zip" "builds/$archive-${GITHUB_SHA:0:7}.zip"
            gh release upload "$tag" "builds/$archive-${GITHUB_SHA:0:7}.zip"
          fi
          url="$(gh release view "$tag" --json url --jq .url)"
          printf '## Verified %s build\n\n[Download build](%s)\n\nCommit: `%s`\n\nThe exported game ran 400 frames from the title, native kernels loaded, no errors.\n' \
            '${{ matrix.platform }}' "$url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
