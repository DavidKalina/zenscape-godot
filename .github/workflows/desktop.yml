name: Godot desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/godot-build*"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: godot-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    name: Export Windows and macOS
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # Private draft build downloads; PR runs only export.
    outputs:
      release-tag: ${{ steps.downloads.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and desktop templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-desktop-linux-${{ env.GODOT_VERSION }}-v1

      - name: Install official Godot editor and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/godot-download"
          mkdir -p "$download" "$HOME/.local/bin"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          gh release download "${GODOT_VERSION}-stable" --repo godotengine/godot-builds \
            --pattern "$editor" --pattern "$templates" --pattern SHA512-SUMS.txt \
            --dir "$download"
          cd "$download"
          # Check both archives against the official release's checksums.
          grep -F -e "$editor" -e "$templates" SHA512-SUMS.txt > desktop-checksums.txt
          test "$(wc -l < desktop-checksums.txt)" -eq 2
          sha512sum --check desktop-checksums.txt
          unzip -q "$editor"
          install -m 755 "${editor%.zip}" "$HOME/.local/bin/godot"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -j -q "$templates" templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/macos.zip templates/version.txt -d "$template_dir"

      - name: Import project assets
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/godot" --version
          "$HOME/.local/bin/godot" --headless --path . --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' import.log; then exit 1; fi

      - name: Export release builds
        run: |
          mkdir -p builds/windows
          godot --headless --path . --export-release Windows 2>&1 | tee windows-export.log
          if grep -E 'SCRIPT ERROR:|ERROR:' windows-export.log; then exit 1; fi
          godot --headless --path . --export-release macOS 2>&1 | tee mac-export.log
          if grep -E 'SCRIPT ERROR:|ERROR:' mac-export.log; then exit 1; fi
          test -s builds/windows/ZenScape.exe
          test -s builds/windows/ZenScape.pck
          test -s builds/ZenScape-mac-universal.zip
          cp docs/desktop-builds.md builds/windows/README.md
          printf 'Commit: %s\nGodot: %s\n' "$GITHUB_SHA" "$GODOT_VERSION" > builds/windows/BUILD.txt
          (cd builds/windows && zip -r ../ZenScape-windows-x64.zip .)

      - name: Create private draft build downloads
        id: downloads
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          url="$(gh release create "$tag" builds/ZenScape-windows-x64.zip builds/ZenScape-mac-universal.zip \
            --draft --target "$GITHUB_SHA" --title "Godot desktop · ${GITHUB_REF_NAME} · ${GITHUB_SHA:0:7}" \
            --notes-file docs/desktop-builds.md)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          printf '## Godot desktop downloads\n\n[Download Windows and Mac builds](%s)\n\nCommit: `%s`\n\n' "$url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          - **Windows:** extract `ZenScape-windows-x64.zip` and open `ZenScape.exe`. Keep its `.pck` and DLLs beside it.
          - **Mac (Apple Silicon or Intel):** extract `ZenScape-mac-universal.zip`, move `ZenScape.app` to Applications, and open it.

          Sign into GitHub with repository write access to view these draft downloads.
          Native startup checks below must pass before treating these builds as verified.
          These are personal test builds without publisher certificates; see the release notes for first-launch instructions.
          EOF

  smoke:
    name: Startup check (${{ matrix.platform }})
    needs: export
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            artifact: ZenScape-windows-x64
          - platform: macOS
            os: macos-latest
            artifact: ZenScape-mac-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Download exported game
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.export.outputs.release-tag }}
          ARCHIVE_NAME: ${{ matrix.artifact }}.zip
        run: |
          mkdir -p build
          gh release download "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE_NAME" --dir build

      - name: Launch Windows export
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive build/ZenScape-windows-x64.zip -DestinationPath build/game
          $process = Start-Process -FilePath "$PWD/build/game/ZenScape.exe" -ArgumentList '--headless', '--quit-after', '120', '--log-file', "$PWD/startup.log" -Wait -PassThru
          Get-Content startup.log
          if ($process.ExitCode -ne 0) { throw "Startup failed: $($process.ExitCode)" }
          if (Select-String -Path startup.log -Pattern 'SCRIPT ERROR:|ERROR:') { throw 'Godot reported startup errors' }

      - name: Launch Mac export
        if: runner.os == 'macOS'
        run: |
          ditto -x -k build/ZenScape-mac-universal.zip build/game
          executable="$(find build/game -path '*/Contents/MacOS/*' -type f | head -n 1)"
          test -n "$executable"
          "$executable" --headless --quit-after 120 --log-file "$PWD/startup.log"
          cat startup.log
          if grep -E 'SCRIPT ERROR:|ERROR:' startup.log; then exit 1; fi
