[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/**/*.json,scripts/endless/line_tune.json,assets/audio/ATTRIBUTION.md,assets/fonts/*.txt"
exclude_filter="docs/*,tests/*,tools/*,art/*,builds/*"
export_path="builds/windows/ZenScape.exe"

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=0
codesign/enable=false
application/modify_resources=true
application/icon="res://icon.ico"
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name="David Kalina"
application/product_name="ZenScape"
application/file_description="ZenScape"
application/copyright="© 2026 David Kalina"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="assets/**/*.json,scripts/endless/line_tune.json,assets/audio/ATTRIBUTION.md,assets/fonts/*.txt"
exclude_filter="docs/*,tests/*,tools/*,art/*,builds/*"
export_path="builds/ZenScape-mac-universal.zip"

[preset.1.options]

binary_format/architecture="universal"
application/name="ZenScape"
application/icon="res://icon.icns"
application/bundle_identifier="app.zenscape.godot"
application/short_version="0.1.0"
application/version="0.1.0"
application/copyright="© 2026 David Kalina"
codesign/codesign=1
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
